<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">Two steps to make IntelliJ run the same rules as the build</title>
  <desc id="d">In the SpotBugs plugin, disable the two bundled rule packs and add the newer jars
  from spotbugs-rule-packs, plus the exclude filter. In the PMD plugin, add the shared ruleset.</desc>

  <rect width="880" height="404" fill="#fbfbfa"/>
  <rect x="0.5" y="0.5" width="879" height="403" fill="none" stroke="#e4e4df"/>

  <text x="40" y="38" font-size="17" font-weight="600" fill="#1a1a19">Two steps, once per machine</text>
  <text x="40" y="58" font-size="12.5" fill="#6b6b68">After these the IDE and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">static-scan.sh</tspan> report the same findings.</text>

  <!-- ============ STEP 1 : SpotBugs ============ -->
  <rect x="40" y="80" width="404" height="252" rx="6" fill="#ffffff" stroke="#d8d8d4"/>
  <rect x="40" y="80" width="404" height="30" rx="6" fill="#f2f6fa"/>
  <rect x="40" y="104" width="404" height="6" fill="#f2f6fa"/>
  <circle cx="60" cy="95" r="9" fill="#3a6ea5"/>
  <text x="60" y="99" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="100" font-size="12.5" font-weight="600" fill="#1a1a19">SpotBugs</text>
  <line x1="40" y1="110" x2="444" y2="110" stroke="#d8d8d4"/>

  <text x="58" y="132" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a6ea5">Settings → Tools → SpotBugs → Plugins</text>

  <g font-size="12">
    <text x="58" y="158" font-size="14" fill="#b04a4a">✕</text>
    <text x="78" y="158" fill="#1a1a19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fb-contrib 7.6.0</text>
    <text x="260" y="158" fill="#8a8a85">bundled — untick</text>

    <text x="58" y="180" font-size="14" fill="#b04a4a">✕</text>
    <text x="78" y="180" fill="#1a1a19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">findsecbugs 1.12.0</text>
    <text x="260" y="180" fill="#8a8a85">bundled — untick</text>

    <text x="58" y="204" font-size="14" fill="#2e7d5b">✓</text>
    <text x="78" y="204" fill="#1a1a19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sb-contrib 7.6.9</text>
    <text x="260" y="204" fill="#8a8a85">＋ add from disk</text>

    <text x="58" y="226" font-size="14" fill="#2e7d5b">✓</text>
    <text x="78" y="226" fill="#1a1a19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">findsecbugs 1.14.0</text>
    <text x="260" y="226" fill="#8a8a85">＋ add from disk</text>
  </g>

  <rect x="58" y="240" width="368" height="34" rx="4" fill="#fdf6f4" stroke="#e8c4bc"/>
  <text x="70" y="254" font-size="11" fill="#8a4b3c">Same plugin id: leave a bundled copy ticked alongside its</text>
  <text x="70" y="268" font-size="11" fill="#8a4b3c">replacement and analysis fails instead of picking one.</text>

  <line x1="58" y1="288" x2="426" y2="288" stroke="#ececE8"/>
  <text x="58" y="306" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a6ea5">… → SpotBugs → Filter</text>
  <text x="58" y="323" font-size="12" fill="#44443f">＋ <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spotbugs-exclude.xml</tspan> as an exclude filter</text>

  <!-- ============ STEP 2 : PMD ============ -->
  <rect x="464" y="80" width="376" height="252" rx="6" fill="#ffffff" stroke="#d8d8d4"/>
  <rect x="464" y="80" width="376" height="30" rx="6" fill="#f2f6fa"/>
  <rect x="464" y="104" width="376" height="6" fill="#f2f6fa"/>
  <circle cx="484" cy="95" r="9" fill="#3a6ea5"/>
  <text x="484" y="99" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="502" y="100" font-size="12.5" font-weight="600" fill="#1a1a19">PMD</text>
  <line x1="464" y1="110" x2="840" y2="110" stroke="#d8d8d4"/>

  <text x="482" y="132" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a6ea5">Settings → Tools → PMD</text>

  <text x="482" y="158" font-size="14" fill="#2e7d5b">✓</text>
  <text x="502" y="158" font-size="12" fill="#1a1a19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pmd-performance.xml</text>
  <text x="502" y="176" font-size="11.5" fill="#8a8a85">＋ add as a custom ruleset</text>

  <rect x="482" y="196" width="340" height="52" rx="4" fill="#f4faf7" stroke="#b6ddc9"/>
  <text x="494" y="214" font-size="11" fill="#2e7d5b" font-weight="600">Run it</text>
  <text x="494" y="232" font-size="11.5" fill="#44443f">right-click → Run PMD → Custom →</text>
  <text x="494" y="244" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#44443f">java-profiling-tools</text>

  <line x1="482" y1="266" x2="822" y2="266" stroke="#ececE8"/>
  <text x="482" y="288" font-size="12" font-weight="600" fill="#1a1a19">PMD reads source</text>
  <text x="482" y="306" font-size="11.5" fill="#6b6b68">No build needed — it parses the files on disk,</text>
  <text x="482" y="322" font-size="11.5" fill="#6b6b68">saved or not, depending on your IDE settings.</text>

  <text x="40" y="362" font-size="12" fill="#6b6b68"><tspan font-weight="600" fill="#1a1a19">SpotBugs reads bytecode.</tspan> Run Build → Build Project before analysing, or you are looking at stale class</text>
  <text x="40" y="380" font-size="12" fill="#6b6b68">files: findings land on code you already changed, with line numbers that no longer match the editor.</text>
</svg>
