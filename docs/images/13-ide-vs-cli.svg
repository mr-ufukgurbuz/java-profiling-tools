<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">The same rules in the IDE and on the command line</title>
  <desc id="d">The rule packs and PMD ruleset in this repository feed both the IntelliJ plugins
  and static-scan.sh. The rules are identical in both; the analyser engine versions differ.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a85"/>
    </marker>
  </defs>

  <rect width="880" height="432" fill="#fbfbfa"/>
  <rect x="0.5" y="0.5" width="879" height="431" fill="none" stroke="#e4e4df"/>

  <text x="40" y="38" font-size="17" font-weight="600" fill="#1a1a19">One set of rules, two places that run them</text>
  <text x="40" y="58" font-size="12.5" fill="#6b6b68">Configure the IDE once (see plugins/idea/) and it reports what the build reports.</text>

  <!-- shared configuration band -->
  <rect x="40" y="78" width="800" height="112" rx="6" fill="#f2f6fa" stroke="#c3d4e4"/>
  <text x="56" y="98" font-size="11" font-weight="600" fill="#3a6ea5" letter-spacing="0.6">SHARED CONFIGURATION — VERSIONED HERE, UNPACKED BY 00-setup.sh</text>

  <rect x="56" y="108" width="380" height="68" rx="5" fill="#ffffff" stroke="#c3d4e4"/>
  <text x="70" y="127" font-size="12.5" font-weight="600" fill="#1a1a19">tools/spotbugs-rule-packs/</text>
  <text x="70" y="145" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#44443f">sb-contrib 7.6.9 · findsecbugs 1.14.0</text>
  <text x="70" y="163" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#44443f">spotbugs-exclude.xml</text>

  <rect x="452" y="108" width="372" height="68" rx="5" fill="#ffffff" stroke="#c3d4e4"/>
  <text x="466" y="127" font-size="12.5" font-weight="600" fill="#1a1a19">pmd-rulesets/</text>
  <text x="466" y="145" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#44443f">pmd-performance.xml</text>
  <text x="466" y="163" font-size="11.5" fill="#6b6b68">performance + multithreading + design</text>

  <!-- connectors -->
  <g fill="none" stroke="#8a8a85" stroke-width="1.3">
    <path d="M246 190 V 206 M150 206 H 342 M150 206 V 246" marker-end="url(#a)"/>
    <path d="M342 206 V 246" marker-end="url(#a)"/>
    <path d="M638 190 V 206 M542 206 H 734 M542 206 V 246" marker-end="url(#a)"/>
    <path d="M734 206 V 246" marker-end="url(#a)"/>
  </g>

  <!-- four engines -->
  <g font-size="12">
    <rect x="56" y="250" width="188" height="76" rx="5" fill="#faf6fd" stroke="#d3bde6"/>
    <text x="70" y="270" font-size="10.5" font-weight="600" fill="#7a4fa3" letter-spacing="0.5">INTELLIJ IDEA</text>
    <text x="70" y="291" font-size="12.5" font-weight="600" fill="#1a1a19">SpotBugs plugin 1.2.8</text>
    <text x="70" y="311" font-size="11.5" fill="#6b6b68">engine 4.8.6</text>

    <rect x="248" y="250" width="188" height="76" rx="5" fill="#f4faf7" stroke="#b6ddc9"/>
    <text x="262" y="270" font-size="10.5" font-weight="600" fill="#2e7d5b" letter-spacing="0.5">COMMAND LINE</text>
    <text x="262" y="291" font-size="12.5" font-weight="600" fill="#1a1a19">static-scan.sh</text>
    <text x="262" y="311" font-size="11.5" fill="#6b6b68">SpotBugs 4.10.4</text>

    <rect x="452" y="250" width="184" height="76" rx="5" fill="#faf6fd" stroke="#d3bde6"/>
    <text x="466" y="270" font-size="10.5" font-weight="600" fill="#7a4fa3" letter-spacing="0.5">INTELLIJ IDEA</text>
    <text x="466" y="291" font-size="12.5" font-weight="600" fill="#1a1a19">PMD plugin 2.1.0</text>
    <text x="466" y="311" font-size="11.5" fill="#6b6b68">engine 7.21.0 · 68 rules</text>

    <rect x="640" y="250" width="184" height="76" rx="5" fill="#f4faf7" stroke="#b6ddc9"/>
    <text x="654" y="270" font-size="10.5" font-weight="600" fill="#2e7d5b" letter-spacing="0.5">COMMAND LINE</text>
    <text x="654" y="291" font-size="12.5" font-weight="600" fill="#1a1a19">static-scan.sh</text>
    <text x="654" y="311" font-size="11.5" fill="#6b6b68">PMD 7.27.0 · 69 rules</text>
  </g>

  <!-- verdict strip -->
  <rect x="56" y="342" width="380" height="30" rx="4" fill="#ffffff" stroke="#e4e4df"/>
  <text x="246" y="361" font-size="12" text-anchor="middle" fill="#44443f">same rule packs · different engine</text>
  <rect x="452" y="342" width="372" height="30" rx="4" fill="#ffffff" stroke="#e4e4df"/>
  <text x="638" y="361" font-size="12" text-anchor="middle" fill="#44443f">same ruleset · different engine</text>

  <text x="40" y="398" font-size="12" fill="#6b6b68">The engines cannot be reconciled: each plugin links against the analyser it was built with.</text>
  <text x="40" y="416" font-size="12" fill="#6b6b68">Where the two disagree the command line is the newer analyser, so settle it against the build.</text>
</svg>
